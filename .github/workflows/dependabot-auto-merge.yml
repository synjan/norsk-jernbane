name: Dependabot auto-merge

# Auto-merger Dependabot-PR-er for patch- og minor-oppdateringer når CI
# er grønn. Major-bumps (potensielt breaking) lar vi mennesker se på først.
#
# Forutsetning: `allow_auto_merge` må være aktivert på repoet
# (kjør én gang: gh api -X PATCH /repos/<owner>/<repo> -f allow_auto_merge=true).

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Kjør kun på Dependabot-PR-er. pull_request_target gir oss tilgang
    # til hemmeligheter selv om PR-en er fra dependabot[bot].
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR (kun patch og minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aktiver auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kommenter på major-bumps (krever menneskelig review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🔍 Major version bump for **${{ steps.meta.outputs.dependency-names }}** (${{ steps.meta.outputs.previous-version }} → ${{ steps.meta.outputs.new-version }}) — auto-merge er hoppet over. Se changelog før du merger manuelt."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
